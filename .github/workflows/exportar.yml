name: Testar e exportar .exe

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.3

jobs:
  exportar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache do Godot e templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-windows

      - name: Baixar Godot e templates de exportação
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          # Tenta os dois repositórios oficiais de builds, com espera crescente,
          # porque o download de ~1 GB dos templates às vezes falha (504 ou truncado).
          baixar() {
            for tentativa in 1 2 3 4 5; do
              for repo in godot-builds godot; do
                URL=https://github.com/godotengine/$repo/releases/download/${GODOT_VERSION}-stable/$1
                if curl -fsSL -o "$1" "$URL" && unzip -tq "$1" >/dev/null; then
                  return 0
                fi
                echo "Falhou: $URL (tentativa $tentativa)"
              done
              sleep $((tentativa * 20))
            done
            return 1
          }
          baixar Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
          baixar Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          DEST=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p $DEST
          unzip -q -j Godot_v${GODOT_VERSION}-stable_export_templates.tpz templates/windows_release_x86_64.exe templates/windows_debug_x86_64.exe templates/version.txt -d $DEST
          rm Godot_v${GODOT_VERSION}-stable_export_templates.tpz Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip

      - name: Importar recursos
        run: ./godot --headless --import

      - name: Testes automáticos
        run: ./godot --headless res://tests/teste_auto.tscn

      - name: Exportar para Windows
        run: |
          mkdir -p build
          ./godot --headless --export-release "Windows Desktop" build/Aevorath.exe
          test -f build/Aevorath.exe

      - uses: actions/upload-artifact@v4
        with:
          name: Aevorath-windows
          path: build/Aevorath.exe
